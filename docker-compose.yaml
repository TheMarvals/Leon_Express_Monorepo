version: '3.8'

services:
  backend:
    build:
      context: ./LeonExpress_back
      dockerfile: Dockerfile
    container_name: leonexpress_backend
    environment:
      - NODE_ENV=production
      # Base de Datos administrada por Coolify (Configurar en UI de Coolify)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # Secretos
      - JWT_SECRET=${JWT_SECRET}
      - OCR_SPACE_API_KEY=${OCR_SPACE_API_KEY}
      - OCR_PROVIDER=${OCR_PROVIDER:-local}
      - OCR_LOCAL_URL=${OCR_LOCAL_URL:-http://leonexpress-ocr:8000/parse/image}
      - FRONTEND_URL=${FRONTEND_URL:-https://leonexpress.cl}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - ML_GATEWAY_URL=${ML_GATEWAY_URL:-https://gateway.leonexpress.cl}
      - ML_GATEWAY_API_KEY=${ML_GATEWAY_API_KEY}
    networks:
      - default
      - ocr_private
    volumes:
      - /opt/leon_express/data/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://127.0.0.1:4100/api/auth/me',s=>process.exit(s.statusCode===401?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./LeonExpress_front
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_VAPID_PUBLIC_KEY=${VITE_VAPID_PUBLIC_KEY}
    container_name: leonexpress_frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: leonexpress_nginx
    # Coolify detectará este puerto automáticamente o puedes asignarlo en la UI
    expose:
      - "80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped


networks:
  ocr_private:
    external: true
    name: ${OCR_NETWORK_NAME:-leonexpress_ocr_network}

<!doctype html>
<html lang="es" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="/fa4.css" />
    <link rel="icon" href="/favicon.ico" />

    <meta
      name="description"
      content="León Express. Logística de envíos para tu negocio. Gestiona tus paquetes, solicita colectas y consulta el seguimiento de tus envíos."
    />
    <title>León Express · Logística de envíos</title>

    <style>
      /* Set vuestic higher priority over tailwind normalize css */
      @layer tailwind.base, vuestic;
    </style>
    <script>
      // Desregistrar Service Worker antiguo (/sw.js) atrapado en CDN
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var reg = registrations[i];
            var swUrl = (reg.active && reg.active.scriptURL) || (reg.installing && reg.installing.scriptURL) || (reg.waiting && reg.waiting.scriptURL) || '';
            if (swUrl.endsWith('/sw.js')) {
              reg.unregister().then(function () {
                if ('caches' in window) {
                  caches.keys().then(function (names) {
                    names.forEach(function (n) { caches.delete(n); });
                  });
                }
              });
            }
          }
        });
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
